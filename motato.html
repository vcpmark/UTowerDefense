<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Motato MVP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1220;
      color: #e8eaf6;
      overflow: hidden;
      position: fixed;
      touch-action: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile */
      width: 100vw;
      padding: 8px;
      gap: 8px;
    }

    .game-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    canvas {
      background: #0b0f1f;
      border-radius: 8px;
      border: 1px solid #273057;
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      touch-action: none;
    }

    /* Virtual Joystick */
    .joystick-zone {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 140px;
      height: 140px;
      pointer-events: all;
      z-index: 100;
    }

    .joystick-base {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(44, 55, 112, 0.3);
      border: 2px solid rgba(91, 114, 255, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .joystick-stick {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5b72ff, #7c9eff);
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 2px 10px rgba(91, 114, 255, 0.5);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.1s ease-out;
      pointer-events: none;
    }

    .ui-panel {
      background: #141830;
      border: 1px solid #263059;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.25);
      flex-shrink: 0;
    }

    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(15,20,43,0.45);
      border: 1px solid #2a3470;
      border-radius: 8px;
      padding: 6px 10px;
      flex: 1;
      min-width: 70px;
    }

    .stat-label {
      font-size: 10px;
      color: #9aa3d7;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: #7c9eff;
    }

    .btn {
      background: linear-gradient(135deg, #5b72ff, #7c9eff);
      color: #fff;
      border: 0;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      touch-action: manipulation;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .game-info {
      font-size: 12px;
      color: #a6b3f5;
      text-align: center;
      padding: 8px;
      background: rgba(23,30,68,0.55);
      border: 1px solid rgba(112,129,255,0.25);
      border-radius: 8px;
      margin-top: 8px;
    }

    /* Desktop layout */
    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        padding: 16px;
        gap: 16px;
      }

      .game-wrapper {
        flex: 1;
      }

      .ui-panel {
        width: 320px;
        flex-shrink: 0;
        overflow-y: auto;
      }

      .joystick-zone {
        display: none;
      }

      .stat-card {
        min-width: auto;
      }

      .stats-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Prevent pull-to-refresh on iOS */
    body {
      overscroll-behavior-y: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-wrapper">
      <canvas id="game" width="800" height="480"></canvas>

      <!-- Virtual Joystick for Mobile -->
      <div class="joystick-zone" id="joystickZone">
        <div class="joystick-base"></div>
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
    </div>

    <div class="ui-panel">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">❤️ HP</div>
          <div class="stat-value" id="health">100</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">🌊 Wave</div>
          <div class="stat-value" id="wave">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">💰 Score</div>
          <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">👾 Foes</div>
          <div class="stat-value" id="enemies">0</div>
        </div>
      </div>

      <button id="startWave" class="btn">Start Wave</button>

      <div class="game-info" id="gameInfo">
        Tap "Start Wave" to begin!
      </div>
    </div>
  </div>

  <script>
    // Prevent iOS Safari bounce scrolling
    document.addEventListener('touchmove', (e) => {
      if (e.target === document.body || e.target === document.documentElement) {
        e.preventDefault();
      }
    }, { passive: false });

    // Simple game state
    const game = {
      canvas: null,
      ctx: null,
      player: { x: 400, y: 240, radius: 16, speed: 200, health: 100, maxHealth: 100 },
      enemies: [],
      bullets: [],
      wave: 0,
      score: 0,
      waveActive: false,
      waveTimer: 0,
      spawnTimer: 0,
      shootTimer: 0,
      keys: {},
      lastTime: 0,
      gameOver: false,
      // Touch controls
      joystick: { active: false, x: 0, y: 0, startX: 0, startY: 0 }
    };

    // Virtual Joystick
    const joystickZone = document.getElementById('joystickZone');
    const joystickStick = document.getElementById('joystickStick');
    let joystickTouchId = null;

    function setupJoystick() {
      joystickZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        joystickTouchId = touch.identifier;

        const rect = joystickZone.getBoundingClientRect();
        game.joystick.active = true;
        game.joystick.startX = rect.left + rect.width / 2;
        game.joystick.startY = rect.top + rect.height / 2;
        updateJoystick(touch.clientX, touch.clientY);
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (!game.joystick.active) return;

        for (let touch of e.changedTouches) {
          if (touch.identifier === joystickTouchId) {
            e.preventDefault();
            updateJoystick(touch.clientX, touch.clientY);
            break;
          }
        }
      }, { passive: false });

      document.addEventListener('touchend', (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joystickTouchId) {
            game.joystick.active = false;
            game.joystick.x = 0;
            game.joystick.y = 0;
            joystickTouchId = null;
            joystickStick.style.transform = 'translate(-50%, -50%)';
            break;
          }
        }
      }, { passive: false });
    }

    function updateJoystick(touchX, touchY) {
      const dx = touchX - game.joystick.startX;
      const dy = touchY - game.joystick.startY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const maxDistance = 40;

      if (distance > 0) {
        const angle = Math.atan2(dy, dx);
        const clampedDistance = Math.min(distance, maxDistance);

        game.joystick.x = Math.cos(angle) * (clampedDistance / maxDistance);
        game.joystick.y = Math.sin(angle) * (clampedDistance / maxDistance);

        // Update visual position
        const offsetX = game.joystick.x * maxDistance;
        const offsetY = game.joystick.y * maxDistance;
        joystickStick.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
      }
    }

    // Initialize
    function init() {
      game.canvas = document.getElementById('game');
      game.ctx = game.canvas.getContext('2d');

      // Keyboard input (for desktop)
      window.addEventListener('keydown', (e) => {
        game.keys[e.key.toLowerCase()] = true;
        e.preventDefault();
      });
      window.addEventListener('keyup', (e) => {
        game.keys[e.key.toLowerCase()] = false;
        e.preventDefault();
      });

      // Setup touch controls
      setupJoystick();

      // Start wave button
      document.getElementById('startWave').addEventListener('click', startWave);

      // Start game loop
      game.lastTime = performance.now() / 1000;
      requestAnimationFrame(gameLoop);

      console.log('Game initialized successfully!');
    }

    // Start a new wave
    function startWave() {
      if (game.waveActive || game.gameOver) return;

      game.wave++;
      game.waveActive = true;
      game.waveTimer = 20 + game.wave * 3;
      game.spawnTimer = 0;
    }

    // Game loop
    function gameLoop(currentTime) {
      currentTime /= 1000;
      const dt = Math.min(currentTime - game.lastTime, 0.1);
      game.lastTime = currentTime;

      if (!game.gameOver) {
        update(dt);
      }
      render();
      updateUI();

      requestAnimationFrame(gameLoop);
    }

    // Update game logic
    function update(dt) {
      // Update player movement (keyboard or touch)
      let moveX = 0;
      let moveY = 0;

      // Keyboard input
      if (game.keys['w'] || game.keys['arrowup']) moveY -= 1;
      if (game.keys['s'] || game.keys['arrowdown']) moveY += 1;
      if (game.keys['a'] || game.keys['arrowleft']) moveX -= 1;
      if (game.keys['d'] || game.keys['arrowright']) moveX += 1;

      // Touch input (joystick)
      if (game.joystick.active) {
        moveX = game.joystick.x;
        moveY = game.joystick.y;
      }

      // Normalize diagonal movement (only for keyboard)
      if (!game.joystick.active) {
        const mag = Math.sqrt(moveX * moveX + moveY * moveY);
        if (mag > 0) {
          moveX /= mag;
          moveY /= mag;
        }
      }

      // Move player
      game.player.x += moveX * game.player.speed * dt;
      game.player.y += moveY * game.player.speed * dt;

      // Keep player in bounds
      game.player.x = Math.max(30, Math.min(770, game.player.x));
      game.player.y = Math.max(30, Math.min(450, game.player.y));

      // Auto-shoot
      game.shootTimer -= dt;
      if (game.shootTimer <= 0 && game.enemies.length > 0) {
        shootAtNearestEnemy();
        game.shootTimer = 0.3;
      }

      // Update bullets
      for (let i = game.bullets.length - 1; i >= 0; i--) {
        const bullet = game.bullets[i];
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;

        // Remove if out of bounds
        if (bullet.x < 0 || bullet.x > 800 || bullet.y < 0 || bullet.y > 480) {
          game.bullets.splice(i, 1);
          continue;
        }

        // Check collision with enemies
        for (let j = game.enemies.length - 1; j >= 0; j--) {
          const enemy = game.enemies[j];
          const dx = enemy.x - bullet.x;
          const dy = enemy.y - bullet.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < enemy.radius + bullet.radius) {
            enemy.health -= bullet.damage;
            game.bullets.splice(i, 1);

            if (enemy.health <= 0) {
              game.enemies.splice(j, 1);
              game.score += 10;
            }
            break;
          }
        }
      }

      // Update enemies
      for (let i = game.enemies.length - 1; i >= 0; i--) {
        const enemy = game.enemies[i];

        // Move towards player
        const dx = game.player.x - enemy.x;
        const dy = game.player.y - enemy.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 20) {
          enemy.x += (dx / dist) * enemy.speed * dt;
          enemy.y += (dy / dist) * enemy.speed * dt;
        } else {
          // Damage player
          game.player.health -= 10 * dt;
          if (game.player.health <= 0) {
            game.gameOver = true;
          }
        }
      }

      // Update wave
      if (game.waveActive) {
        game.waveTimer -= dt;
        game.spawnTimer -= dt;

        if (game.spawnTimer <= 0 && game.waveTimer > 0) {
          spawnEnemy();
          game.spawnTimer = Math.max(0.5, 2 - game.wave * 0.1);
        }

        // Check wave complete
        if (game.waveTimer <= 0 && game.enemies.length === 0) {
          game.waveActive = false;
        }
      }
    }

    // Shoot at nearest enemy
    function shootAtNearestEnemy() {
      if (game.enemies.length === 0) return;

      let nearest = null;
      let minDist = Infinity;

      for (const enemy of game.enemies) {
        const dx = enemy.x - game.player.x;
        const dy = enemy.y - game.player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < minDist) {
          minDist = dist;
          nearest = enemy;
        }
      }

      if (nearest) {
        const dx = nearest.x - game.player.x;
        const dy = nearest.y - game.player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const speed = 300;

        game.bullets.push({
          x: game.player.x,
          y: game.player.y,
          vx: (dx / dist) * speed,
          vy: (dy / dist) * speed,
          radius: 4,
          damage: 20
        });
      }
    }

    // Spawn an enemy
    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;

      switch (side) {
        case 0: x = Math.random() * 800; y = -20; break;
        case 1: x = 820; y = Math.random() * 480; break;
        case 2: x = Math.random() * 800; y = 500; break;
        case 3: x = -20; y = Math.random() * 480; break;
      }

      game.enemies.push({
        x, y,
        radius: 12,
        speed: 40 + game.wave * 5,
        health: 30 + game.wave * 10,
        maxHealth: 30 + game.wave * 10
      });
    }

    // Render
    function render() {
      const ctx = game.ctx;

      // Clear
      ctx.fillStyle = '#0b0f1f';
      ctx.fillRect(0, 0, 800, 480);

      // Draw player
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(game.player.x, game.player.y, game.player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Draw bullets
      ctx.fillStyle = '#60a5fa';
      for (const bullet of game.bullets) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw enemies
      for (const enemy of game.enemies) {
        // Enemy body
        ctx.fillStyle = '#8b5cf6';
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fill();

        // Health bar
        const barWidth = 24;
        const barHeight = 3;
        const healthPercent = enemy.health / enemy.maxHealth;

        ctx.fillStyle = '#1f2937';
        ctx.fillRect(enemy.x - barWidth/2, enemy.y - enemy.radius - 8, barWidth, barHeight);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(enemy.x - barWidth/2, enemy.y - enemy.radius - 8, barWidth * healthPercent, barHeight);
      }

      // Game over overlay
      if (game.gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, 800, 480);

        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', 400, 220);

        ctx.fillStyle = '#e8eaf6';
        ctx.font = '24px sans-serif';
        ctx.fillText(`Wave ${game.wave} • Score ${game.score}`, 400, 260);
      }
    }

    // Update UI
    function updateUI() {
      document.getElementById('health').textContent = Math.max(0, Math.floor(game.player.health));
      document.getElementById('wave').textContent = game.wave;
      document.getElementById('score').textContent = game.score;
      document.getElementById('enemies').textContent = game.enemies.length;

      const startBtn = document.getElementById('startWave');
      startBtn.disabled = game.waveActive || game.gameOver;
      startBtn.textContent = game.waveActive ? 'Wave Active...' :
                            game.gameOver ? 'Game Over' :
                            'Start Wave';

      const info = document.getElementById('gameInfo');
      if (game.gameOver) {
        info.innerHTML = `<strong style="color: #ef4444;">Game Over!</strong> Wave ${game.wave} • Score ${game.score}`;
      } else if (game.waveActive) {
        const timeLeft = Math.max(0, Math.ceil(game.waveTimer));
        info.textContent = `Wave ${game.wave} • ${game.enemies.length} enemies • ${timeLeft}s`;
      } else {
        info.textContent = `Ready for wave ${game.wave + 1}. Tap Start!`;
      }
    }

    // Start the game
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
