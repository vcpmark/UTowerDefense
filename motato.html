<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Motato</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1220;
      color: #e8eaf6;
      overflow: hidden;
      position: fixed;
      touch-action: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      padding: 8px;
      gap: 8px;
    }

    .game-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    canvas {
      background: #0b0f1f;
      border-radius: 8px;
      border: 1px solid #273057;
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      touch-action: none;
    }

    .ui-panel {
      background: #141830;
      border: 1px solid #263059;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.25);
      flex-shrink: 0;
    }

    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(15,20,43,0.45);
      border: 1px solid #2a3470;
      border-radius: 8px;
      padding: 6px 10px;
      flex: 1;
      min-width: 70px;
    }

    .stat-label {
      font-size: 10px;
      color: #9aa3d7;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: #7c9eff;
    }

    .btn {
      background: linear-gradient(135deg, #5b72ff, #7c9eff);
      color: #fff;
      border: 0;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      touch-action: manipulation;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .game-info {
      font-size: 12px;
      color: #a6b3f5;
      text-align: center;
      padding: 8px;
      background: rgba(23,30,68,0.55);
      border: 1px solid rgba(112,129,255,0.25);
      border-radius: 8px;
      margin-top: 8px;
    }

    /* Shop Modal */
    .shop-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .shop-modal.active {
      display: flex;
    }

    .shop-content {
      background: #141830;
      border: 2px solid #5b72ff;
      border-radius: 16px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .shop-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #7c9eff;
      text-align: center;
    }

    .shop-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .shop-item {
      background: rgba(15,20,43,0.45);
      border: 2px solid #2a3470;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .shop-item:hover {
      border-color: #5b72ff;
      transform: translateY(-2px);
    }

    .shop-item.cant-afford {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .item-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e8eaf6;
    }

    .item-tier {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .tier-common { background: #6b7280; }
    .tier-uncommon { background: #10b981; }
    .tier-rare { background: #3b82f6; }
    .tier-legendary { background: #f59e0b; }

    .item-effect {
      font-size: 11px;
      color: #9aa3d7;
      margin-bottom: 8px;
    }

    .item-cost {
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        padding: 16px;
        gap: 16px;
      }

      .game-wrapper {
        flex: 1;
      }

      .ui-panel {
        width: 320px;
        flex-shrink: 0;
        overflow-y: auto;
      }

      .stats-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
    }

    body {
      overscroll-behavior-y: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-wrapper">
      <canvas id="game" width="800" height="480"></canvas>
    </div>

    <div class="ui-panel">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">❤️ HP</div>
          <div class="stat-value" id="health">100</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">🌊 Wave</div>
          <div class="stat-value" id="wave">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">💰 Gold</div>
          <div class="stat-value" id="gold">50</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">👾 Enemies</div>
          <div class="stat-value" id="enemies">0</div>
        </div>
      </div>

      <button id="startWave" class="btn">Start Wave</button>

      <div class="game-info" id="gameInfo">
        Tap "Start Wave" to begin!
      </div>
    </div>
  </div>

  <!-- Shop Modal -->
  <div class="shop-modal" id="shopModal">
    <div class="shop-content">
      <h2 class="shop-title">🛒 Shop</h2>
      <div id="shopMoney" style="text-align: center; margin-bottom: 16px; font-size: 18px; color: #fbbf24;">
        💰 Gold: <span id="shopGold">0</span>
      </div>
      <div class="shop-items" id="shopItems"></div>
      <button class="btn" onclick="closeShop()">Close Shop</button>
    </div>
  </div>

  <script type="module">
    // Prevent iOS Safari bounce scrolling
    document.addEventListener('touchmove', (e) => {
      if (e.target === document.body || e.target === document.documentElement) {
        e.preventDefault();
      }
    }, { passive: false });

    import { MotatoGame } from './src/game/MotatoGame.js';

    let game;

    // Touch controls - anywhere on screen
    let touchStart = null;
    let touchCurrent = null;
    const canvas = document.getElementById('game');

    function setupTouchControls() {
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
        touchCurrent = { x: touch.clientX, y: touch.clientY };
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!touchStart) return;
        const touch = e.touches[0];
        touchCurrent = { x: touch.clientX, y: touch.clientY };
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        touchStart = null;
        touchCurrent = null;
      }, { passive: false });
    }

    // Get movement vector from touch
    function getTouchMovement() {
      if (!touchStart || !touchCurrent) return { x: 0, y: 0 };

      const dx = touchCurrent.x - touchStart.x;
      const dy = touchCurrent.y - touchStart.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 5) return { x: 0, y: 0 };

      // Normalize and clamp
      const maxDistance = 100;
      const clampedDistance = Math.min(distance, maxDistance);
      const factor = clampedDistance / maxDistance;

      return {
        x: (dx / distance) * factor,
        y: (dy / distance) * factor
      };
    }

    // Shop System
    const ITEMS = [
      {
        id: 'hp_boost',
        name: '+10 Max HP',
        tier: 'common',
        cost: 15,
        effect: 'Increases maximum health by 10',
        apply: (player) => {
          const playerComp = player.getComponent('player');
          const health = player.getComponent('health');
          playerComp.stats.maxHP += 10;
          health.max += 10;
          health.current += 10;
        }
      },
      {
        id: 'damage_boost',
        name: '+2 Damage',
        tier: 'common',
        cost: 20,
        effect: 'Increases damage by 2',
        apply: (player) => {
          player.getComponent('player').stats.rangedDamage += 2;
        }
      },
      {
        id: 'attack_speed',
        name: '+15% Speed',
        tier: 'uncommon',
        cost: 25,
        effect: 'Increases attack speed by 15%',
        apply: (player) => {
          player.getComponent('player').stats.attackSpeed *= 1.15;
        }
      },
      {
        id: 'crit_chance',
        name: '+5% Crit',
        tier: 'uncommon',
        cost: 30,
        effect: 'Increases critical hit chance',
        apply: (player) => {
          player.getComponent('player').stats.critChance += 5;
        }
      },
      {
        id: 'speed_boost',
        name: '+10% Move Speed',
        tier: 'common',
        cost: 18,
        effect: 'Move faster',
        apply: (player) => {
          player.getComponent('player').stats.speed += 0.1;
        }
      },
      {
        id: 'hp_regen',
        name: '+1 HP Regen',
        tier: 'rare',
        cost: 35,
        effect: 'Regenerate 1 HP per second',
        apply: (player) => {
          player.getComponent('player').stats.hpRegen += 1;
        }
      }
    ];

    function openShop() {
      const modal = document.getElementById('shopModal');
      const itemsContainer = document.getElementById('shopItems');
      document.getElementById('shopGold').textContent = Math.floor(game.gameState.money);

      // Generate 4 random items
      const availableItems = [...ITEMS].sort(() => Math.random() - 0.5).slice(0, 4);

      itemsContainer.innerHTML = '';
      availableItems.forEach(item => {
        const canAfford = game.gameState.money >= item.cost;
        const itemDiv = document.createElement('div');
        itemDiv.className = `shop-item ${!canAfford ? 'cant-afford' : ''}`;
        itemDiv.innerHTML = `
          <div class="item-tier tier-${item.tier}">${item.tier.toUpperCase()}</div>
          <div class="item-name">${item.name}</div>
          <div class="item-effect">${item.effect}</div>
          <div class="item-cost">💰 ${item.cost}</div>
        `;

        if (canAfford) {
          itemDiv.onclick = () => buyItem(item);
        }

        itemsContainer.appendChild(itemDiv);
      });

      modal.classList.add('active');
    }

    function closeShop() {
      document.getElementById('shopModal').classList.remove('active');
    }

    function buyItem(item) {
      if (game.gameState.money >= item.cost) {
        game.gameState.money -= item.cost;
        item.apply(game.playerEntity);
        document.getElementById('shopGold').textContent = Math.floor(game.gameState.money);

        // Refresh shop display
        openShop();
      }
    }

    window.openShop = openShop;
    window.closeShop = closeShop;

    // Initialize
    async function init() {
      setupTouchControls();

      try {
        game = new MotatoGame(canvas);
        await game.init();

        // Override player movement to use touch controls
        const originalUpdate = game.updatePlayerMovement.bind(game);
        game.updatePlayerMovement = function(dt) {
          if (!this.playerEntity) return;

          const velocity = this.playerEntity.getComponent('velocity');
          const player = this.playerEntity.getComponent('player');
          const transform = this.playerEntity.getComponent('transform');

          let moveX = 0;
          let moveY = 0;

          // Keyboard input (desktop)
          if (this.keys['w'] || this.keys['arrowup']) moveY -= 1;
          if (this.keys['s'] || this.keys['arrowdown']) moveY += 1;
          if (this.keys['a'] || this.keys['arrowleft']) moveX -= 1;
          if (this.keys['d'] || this.keys['arrowright']) moveX += 1;

          // Touch input (mobile) - anywhere on screen
          const touchMove = getTouchMovement();
          if (touchMove.x !== 0 || touchMove.y !== 0) {
            moveX = touchMove.x;
            moveY = touchMove.y;
          } else if (moveX !== 0 || moveY !== 0) {
            // Normalize keyboard input
            const mag = Math.sqrt(moveX * moveX + moveY * moveY);
            moveX /= mag;
            moveY /= mag;
          }

          // Apply speed
          const speed = player.speed * player.stats.speed;
          velocity.vx = moveX * speed;
          velocity.vy = moveY * speed;

          // Keep player in bounds
          transform.x = Math.max(this.bounds.minX, Math.min(this.bounds.maxX, transform.x));
          transform.y = Math.max(this.bounds.minY, Math.min(this.bounds.maxY, transform.y));
        };

        // Override wave completion to show shop
        const originalWaveComplete = game.onWaveComplete.bind(game);
        game.onWaveComplete = function() {
          originalWaveComplete();
          openShop();
        };

        // Setup event listeners
        document.getElementById('startWave').addEventListener('click', () => {
          if (game) {
            game.startWave();
          }
        });

        // UI update loop
        requestAnimationFrame(updateUI);

      } catch (error) {
        console.error('Failed to initialize game:', error);
      }
    }

    function updateUI() {
      if (game && game.gameState && game.playerEntity) {
        const state = game.gameState;
        const player = game.playerEntity.getComponent('player');
        const health = game.playerEntity.getComponent('health');

        document.getElementById('gold').textContent = Math.floor(state.money);
        document.getElementById('wave').textContent = state.wave;
        document.getElementById('enemies').textContent = state.enemiesRemaining;

        if (health) {
          document.getElementById('health').textContent = `${Math.floor(health.current)}/${health.max}`;
        }

        const startBtn = document.getElementById('startWave');
        startBtn.disabled = game.waveActive || state.gameOver;
        startBtn.textContent = game.waveActive ? 'Wave Active...' :
                              state.gameOver ? 'Game Over' :
                              'Start Wave';

        const info = document.getElementById('gameInfo');
        if (state.gameOver) {
          info.innerHTML = `<strong style="color: #ef4444;">Game Over!</strong> Wave ${state.wave}`;
        } else if (game.waveActive) {
          const timeLeft = Math.max(0, Math.ceil(game.waveTimer));
          info.textContent = `Wave ${state.wave} • ${game.entityManager.getEntitiesWithTag('enemy').length} enemies • ${timeLeft}s`;
        } else {
          info.textContent = `Ready for wave ${state.wave + 1}. Touch anywhere to move!`;
        }
      }

      requestAnimationFrame(updateUI);
    }

    // Start the game
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
